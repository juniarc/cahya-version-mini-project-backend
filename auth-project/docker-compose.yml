services:
  app:
    build: .
    ports:
      - "${SERVER_PORT:-8081}:8081"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: gvenzl/oracle-xe:21-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    ports:
      - "1522:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      # Oracle takes a few minutes to initialize on first start
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"     # AMQP: the app and clients send messages here
      - "15672:15672"   # Management UI in the browser
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  oracle-data: